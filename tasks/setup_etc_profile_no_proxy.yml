---
- name: Setup no_proxy in /etc/profile
  ansible.builtin.include_tasks: etc_profile/set_etc_profile_no_proxy.yml
  when:
    proxy.etc_profile_no_proxy != "absent"
- name: Remove no_proxy setup from /etc/profile
  ansible.builtin.include_tasks: etc_profile/unset_etc_profile_no_proxy.yml
  when:
    proxy.etc_profile_no_proxy == "absent"
